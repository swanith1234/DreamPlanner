name: Build Android APK

on:
  push:
    branches: [main, Phase-4]
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: # Manual trigger from GitHub UI → Actions tab

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js + Vite build ──────────────────────────────────────────────
      # Node 22 is REQUIRED, not a preference:
      #   @capacitor/cli 8.x  → engines.node ">=22.0.0"  (npx cap sync hard-fails on 20)
      #   vite 7.x            → engines.node "^20.19.0 || >=22.12.0"
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite web app
        run: npm run build
        env:
          # Add your production API URL as a GitHub repo secret:
          # Settings → Secrets and variables → Actions → New repository secret
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # ── 3. Sync Capacitor ────────────────────────────────────────────────────
      - name: Sync Capacitor to Android
        run: npx cap sync android

      # ── 4. Java 21 (required by Capacitor 8) ────────────────────────────────
      # Every Capacitor module declares sourceCompatibility/targetCompatibility
      # JavaVersion.VERSION_21 (@capacitor/android, push-notifications,
      # preferences, capacitor-cordova-android-plugins). JDK 17's javac cannot
      # accept -source 21 and fails during compiler init, before any of our code
      # is even looked at:
      #
      #   Execution failed for task ':capacitor-android:compileDebugJavaWithJavac'
      #   > Java compilation initialization error
      #       error: invalid source release: 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── 5. Cache Gradle (cuts build time from ~4 min → ~90 sec) ─────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 5b. Ensure the compileSdk this project targets is installed ──────────
      # android/variables.gradle pins compileSdkVersion/targetSdkVersion = 36.
      # The runner image does not always ship the newest platform, and Gradle
      # fails with "Failed to install the following SDK components" if it is
      # missing. Idempotent — a no-op when the platform is already present.
      - name: Install Android SDK platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          echo "Installed platforms:"
          ls "$ANDROID_SDK_ROOT/platforms" || true

      # ── 6. Build debug APK ───────────────────────────────────────────────────
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      # ── 7. Upload APK as downloadable artifact ───────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IgniteMate-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # ── 8. Job summary with download instructions ────────────────────────────
      - name: Print download instructions
        run: |
          echo "## ✅ APK Built — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**To download your APK:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Click **Summary** (top of this page)" >> $GITHUB_STEP_SUMMARY
          echo "2. Scroll to **Artifacts** → click \`IgniteMate-debug-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**To install on your phone (sideload):**" >> $GITHUB_STEP_SUMMARY
          echo "- Unzip the downloaded file" >> $GITHUB_STEP_SUMMARY
          echo "- Transfer \`app-debug.apk\` to your Android phone" >> $GITHUB_STEP_SUMMARY
          echo "- Enable *Install from unknown sources* in phone Settings" >> $GITHUB_STEP_SUMMARY
          echo "- Tap the APK file to install" >> $GITHUB_STEP_SUMMARY
